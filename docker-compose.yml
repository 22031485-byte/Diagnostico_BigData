services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bigdata_app
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=employeesdb
      - DB_USERNAME=bigdata
      - DB_PASSWORD=BigData#$$
    depends_on:
      - db
    networks:
      - bigdata_net

  db:
    image: mysql:8.0
    container_name: bigdata_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: employeesdb
      MYSQL_USER: bigdata
      MYSQL_PASSWORD: "BigData#$$"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/sql:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --secure-file-priv=
      - --local-infile=1
    networks:
      - bigdata_net

networks:
  bigdata_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local